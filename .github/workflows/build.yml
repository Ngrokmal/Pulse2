name: Build debug APK

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter (pinned stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.35.7'
          cache: true

      - name: Show versions
        run: |
          flutter --version
          dart --version
          java -version

      - name: Get dependencies
        run: flutter pub get

      - name: Check dependency lockfile
        run: |
          if [ -f pubspec.lock ] && git ls-files --error-unmatch pubspec.lock >/dev/null 2>&1; then
            # pubspec.lock is committed: the build must use exactly it.
            flutter pub get --enforce-lockfile
          else
            echo "::warning::pubspec.lock is not committed. Download the 'pubspec-lock' artifact from this run and commit it to the repository root."
          fi

      - name: Upload resolved pubspec.lock
        uses: actions/upload-artifact@v4
        with:
          name: pubspec-lock
          path: pubspec.lock
          if-no-files-found: warn

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Unit and loopback tests
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Verify APK
        run: |
          APK=build/app/outputs/flutter-apk/app-debug.apk
          test -s "$APK" || { echo "::error::$APK is missing or empty"; exit 1; }
          ls -l "$APK"
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 2>/dev/null | tail -n 1)
          if [ -n "$AAPT" ]; then
            "$AAPT" dump badging "$APK" | grep -E "^package|targetSdkVersion|uses-permission" || true
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
